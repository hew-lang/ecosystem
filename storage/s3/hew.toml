[package]
name = "hew.storage.s3"
version = "0.3.0"
edition = "2026"
hew = ">=0.6.0-rc1, <0.7.0"
description = "Actor-owned S3-compatible object storage with typed errors and byte-exact values"
authors = ["Hew Contributors"]
