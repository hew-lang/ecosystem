# Lefthook pre-commit hooks: format staged files with the pinned formatters.
# Per-developer overrides go in lefthook-local.yml (gitignored).

output:
  - failure
  - execution_out

no_tty: true

pre-commit:
  commands:
    fmt-hew:
      glob: "*.hew"
      stage_fixed: true
      run: hew fmt {staged_files}

    fmt-rust:
      glob: "*.rs"
      stage_fixed: true
      run: cargo fmt --quiet 2>/dev/null
