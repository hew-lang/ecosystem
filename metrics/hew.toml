[package]
name = "hew.metrics"
version = "0.3.0"
edition = "2026"
hew = ">=0.6.0-rc1, <0.7.0"
description = "Actor-owned Prometheus metrics for Hew — typed counters, gauges, histograms, labels, and export"
authors = ["Hew Contributors"]
license = "MIT OR Apache-2.0"
keywords = ["metrics", "prometheus", "monitoring", "observability"]
repository = "https://github.com/hew-lang/ecosystem"

[native]
crate = "."
lib = "hew_hew_metrics"
kind = "staticlib"
