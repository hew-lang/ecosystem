name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Check and test every package against the pinned Hew toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Check native release selection and CLI boundaries
        run: make test-native-release

      - name: Load toolchain pins
        run: grep '^[A-Z_]*=' toolchain.env >> "$GITHUB_ENV"

      - name: Check out pinned Hew source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: hew-lang/hew
          ref: ${{ env.HEW_REVISION }}
          path: .tooling/hew
          fetch-depth: 0

      - uses: ./.tooling/hew/.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Reclaim runner image disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost
          llvm_version_root="$(dirname "${LLVM_SYS_221_PREFIX:?}")"
          if [[ -d /opt/hostedtoolcache ]]; then
            sudo find /opt/hostedtoolcache -mindepth 1 -maxdepth 1 \
              ! -name llvm -exec rm -rf {} +
            if [[ -d /opt/hostedtoolcache/llvm ]]; then
              sudo find /opt/hostedtoolcache/llvm -mindepth 1 -maxdepth 1 \
                ! -path "$llvm_version_root" -exec rm -rf {} +
            fi
          fi
          docker image prune --all --force

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # Only the binary, its runtime library and std are needed afterwards; the
      # build tree is removed to leave disk for the native crates.
      - name: Build pinned Hew toolchain
        shell: bash
        run: |
          set -euo pipefail
          HEW_SOURCE=.tooling/hew make toolchain
          find .tooling/target/release-lib -mindepth 1 -maxdepth 1 \
            ! -name hew ! -name libhew.a -exec rm -rf {} +
          echo "HEW=$GITHUB_WORKSPACE/.tooling/target/release-lib/hew" >> "$GITHUB_ENV"

      # Validates and checks every member and compares it with the registry,
      # so a changed package that kept its published version fails here.
      - name: Dry-run the workspace publish
        run: make publish-check

      - name: Start integration services
        run: docker compose up --detach --wait

      - name: Check every Hew source
        run: make check

      - name: Run Hew tests and examples
        run: make test

      - name: Install native system libraries
        run: bash scripts/setup-native-system-deps.sh magick

      - name: Run native-backed Hew tests and examples
        run: make test-native

      # After the ImageMagick build: clippy over --all-targets links the same
      # system libraries the crates do.
      - name: Lint
        run: make lint

      - name: Run native crate tests
        env:
          CARGO_BUILD_JOBS: 2
        run: make test-crates

      - name: Stop integration services
        if: ${{ always() }}
        run: docker compose down
