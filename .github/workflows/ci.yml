name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Check the corpus against the pinned Hew toolchain
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Load toolchain pins
        run: grep '^[A-Z_]*=' toolchain.env >> "$GITHUB_ENV"

      - name: Check out pinned Hew source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: hew-lang/hew
          ref: ${{ env.HEW_REVISION }}
          path: .tooling/hew
          fetch-depth: 0

      - uses: ./.tooling/hew/.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Reclaim runner image disk
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/share/boost
          llvm_version_root="$(dirname "${LLVM_SYS_221_PREFIX:?}")"
          if [[ -d /opt/hostedtoolcache ]]; then
            sudo find /opt/hostedtoolcache -mindepth 1 -maxdepth 1 \
              ! -name llvm -exec rm -rf {} +
            if [[ -d /opt/hostedtoolcache/llvm ]]; then
              sudo find /opt/hostedtoolcache/llvm -mindepth 1 -maxdepth 1 \
                ! -path "$llvm_version_root" -exec rm -rf {} +
            fi
          fi
          docker image prune --all --force

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      # Only the binary, its runtime library and std are needed afterwards; the
      # build tree is removed to leave disk for the native crates.
      - name: Build pinned Hew toolchain
        shell: bash
        run: |
          set -euo pipefail
          HEW_SOURCE=.tooling/hew make toolchain
          find .tooling/target/release-lib -mindepth 1 -maxdepth 1 \
            ! -name hew ! -name libhew.a -exec rm -rf {} +
          echo "HEW=$GITHUB_WORKSPACE/.tooling/target/release-lib/hew" >> "$GITHUB_ENV"

      - name: Start integration services
        run: docker compose up --detach --wait

      - name: Check every Hew source
        run: scripts/corpus-gate.sh check

      - name: Run Hew suites and examples
        run: scripts/corpus-gate.sh hew

      - name: Install native system libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libclang-dev \
            libjpeg-dev \
            libltdl-dev \
            libpng-dev \
            libssl-dev \
            libtiff-dev \
            libxml2-dev \
            pkg-config \
            shellcheck \
            zlib1g-dev

      - name: Build pinned ImageMagick 7
        shell: bash
        env:
          IMAGEMAGICK_VERSION: 7.1.1-47
          IMAGEMAGICK_SHA256: 818e21a248986f15a6ba0221ab3ccbaed3d3abee4a6feb4609c6f2432a30d7ed
          IMAGEMAGICK_PREFIX: /usr/local
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ImageMagick-$IMAGEMAGICK_VERSION.tar.gz"
          source_dir="$RUNNER_TEMP/ImageMagick-$IMAGEMAGICK_VERSION"
          curl --fail --location --retry 3 \
            "https://github.com/ImageMagick/ImageMagick/archive/refs/tags/$IMAGEMAGICK_VERSION.tar.gz" \
            --output "$archive"
          echo "$IMAGEMAGICK_SHA256  $archive" | sha256sum --check --status
          tar -xzf "$archive" --directory "$RUNNER_TEMP"
          cd "$source_dir"
          ./configure \
            --prefix="$IMAGEMAGICK_PREFIX" \
            --disable-static \
            --without-magick-plus-plus \
            --without-perl
          make --jobs 2
          sudo make install
          sudo ldconfig

      - name: Run native-backed Hew package suites
        run: scripts/corpus-gate.sh native

      # After the ImageMagick build: clippy over --all-targets links the same
      # system libraries the crates do.
      - name: Lint
        run: make lint

      - name: Run native crate tests
        run: cargo test --locked --workspace --all-features --jobs 2

      - name: Stop integration services
        if: ${{ always() }}
        run: docker compose down
