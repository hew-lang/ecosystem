name: Publish packages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      native_packages:
        description: Native package paths (space-separated), or all; empty publishes source only
        type: string
        required: false
      native_qualify:
        description: Install signed native packages and execute maintained consumers without Rust
        type: boolean
        default: false
      native_hosts:
        description: Linux native host cohort
        type: choice
        options: [both, x86_64, aarch64]
        default: both
      native_sdk_version:
        description: Exact official Hew SDK release for native attachments
        type: string
        required: false
      publisher_revision:
        description: Full 40-character Hew commit for the publisher CLI
        type: string
        required: false
      publisher_version:
        description: Exact version the selected publisher CLI must report
        type: string
        required: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish unpublished manifest versions
    if: github.ref == 'refs/heads/main' && !inputs.native_packages && !inputs.native_qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Load toolchain pins
        run: grep '^[A-Z_]*=' toolchain.env >> "$GITHUB_ENV"

      - name: Select publisher CLI
        env:
          PUBLISHER_REVISION_INPUT: ${{ inputs.publisher_revision }}
          PUBLISHER_VERSION_INPUT: ${{ inputs.publisher_version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$PUBLISHER_REVISION_INPUT" || -n "$PUBLISHER_VERSION_INPUT" ]]; then
            if [[ -z "$PUBLISHER_REVISION_INPUT" || -z "$PUBLISHER_VERSION_INPUT" ]]; then
              echo "::error::publisher_revision and publisher_version must be supplied together"
              exit 1
            fi
          fi
          revision="${PUBLISHER_REVISION_INPUT:-$HEW_REVISION}"
          version="${PUBLISHER_VERSION_INPUT:-$HEW_VERSION}"
          if [[ ! "$revision" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::publisher_revision must be a full 40-character commit SHA"
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::publisher_version must be an exact Hew version"
            exit 1
          fi
          printf 'PUBLISHER_REVISION=%s\nPUBLISHER_VERSION=%s\n' "${revision,,}" "$version" >> "$GITHUB_ENV"

      - name: Check out selected Hew source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: hew-lang/hew
          ref: ${{ env.PUBLISHER_REVISION }}
          path: .tooling/hew
          fetch-depth: 0

      - uses: ./.tooling/hew/.github/actions/setup-llvm
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Build selected publisher CLI
        shell: bash
        run: |
          # Remove once Hew build metadata requests an explicit abbreviation.
          git_config_count="${GIT_CONFIG_COUNT:-0}"
          export "GIT_CONFIG_KEY_${git_config_count}=core.abbrev"
          export "GIT_CONFIG_VALUE_${git_config_count}=10"
          export GIT_CONFIG_COUNT="$((git_config_count + 1))"
          HEW_SOURCE=.tooling/hew make toolchain \
            HEW_REVISION="$PUBLISHER_REVISION" HEW_VERSION="$PUBLISHER_VERSION"

      # hew orders the members, skips versions the registry already holds
      # unchanged, fails on a changed tree under an existing version, and
      # reads every upload back. A local `make publish` takes the same path
      # with stored credentials.
      - name: Publish new package versions
        run: make publish PUBLISH_AUTH=github-actions

  native-plan:
    if: inputs.native_packages && (github.ref == 'refs/heads/main' || inputs.native_qualify)
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - id: plan
        env:
          NATIVE_PACKAGES: ${{ inputs.native_packages }}
          SDK_VERSION: ${{ inputs.native_sdk_version }}
          NATIVE_HOSTS: ${{ inputs.native_hosts }}
          PUBLISHER_REVISION: ${{ inputs.publisher_revision }}
          PUBLISHER_VERSION: ${{ inputs.publisher_version }}
        run: |
          set -euo pipefail
          [[ "$SDK_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "An exact official SDK version is required" >&2; exit 1; }
          [[ -z "$PUBLISHER_REVISION$PUBLISHER_VERSION" ]] || { echo "Native cohorts use the official SDK, not publisher overrides" >&2; exit 1; }
          python3 scripts/native-release.py plan --packages "$NATIVE_PACKAGES" --hosts "$NATIVE_HOSTS" --github-output "$GITHUB_OUTPUT"

  native-publish:
    name: Native ${{ inputs.native_qualify && 'consumers' || 'attachments' }} (${{ matrix.host }})
    needs: native-plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/.tooling/native-target
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Download the official SDK
        env:
          GH_TOKEN: ${{ github.token }}
          SDK_VERSION: ${{ inputs.native_sdk_version }}
          SDK_ARCH: ${{ matrix.archive }}
        run: |
          set -euo pipefail
          sdk_dir="$RUNNER_TEMP/official-sdk"
          mkdir -p "$sdk_dir"
          archive="hew-v$SDK_VERSION-$SDK_ARCH.tar.gz"
          gh release download "v$SDK_VERSION" -R hew-lang/hew --pattern "$archive" --pattern "hew-v$SDK_VERSION-checksums.txt" --dir "$sdk_dir"
          cd "$sdk_dir"
          grep -F "  $archive" "hew-v$SDK_VERSION-checksums.txt" | sha256sum --check --strict -
          printf 'NATIVE_SDK_CHECKSUM=%s\n' "$(sha256sum "$archive" | cut -d' ' -f1)" >> "$GITHUB_ENV"
          tar -xzf "$archive"
          printf 'NATIVE_SDK_ROOT=%s/hew-v%s-%s\n' "$sdk_dir" "$SDK_VERSION" "$SDK_ARCH" >> "$GITHUB_ENV"
      - name: Install the pinned Rust toolchain
        if: ${{ !inputs.native_qualify }}
        run: rustup toolchain install
      - name: Install native consumer system libraries
        if: inputs.native_qualify
        run: bash scripts/setup-native-system-deps.sh magick
      - name: Start integration services
        if: inputs.native_qualify
        run: docker compose up --detach --wait
      - name: Verify existing attachments and publish missing native packages
        if: ${{ !inputs.native_qualify }}
        env:
          NATIVE_COHORT: ${{ inputs.native_packages }}
          NATIVE_SDK_VERSION: ${{ inputs.native_sdk_version }}
          NATIVE_HOST: ${{ matrix.host }}
          NATIVE_OUTPUT: ${{ runner.temp }}/native-archives
          TMPDIR: ${{ runner.temp }}
        run: make native-publish NATIVE_RELEASE_ARGS=--install-system-deps
      - name: Execute signed native package consumers without Rust
        if: inputs.native_qualify
        env:
          NATIVE_COHORT: ${{ inputs.native_packages }}
          NATIVE_SDK_VERSION: ${{ inputs.native_sdk_version }}
          NATIVE_HOST: ${{ matrix.host }}
          NATIVE_OUTPUT: ${{ runner.temp }}/native-archives
          TMPDIR: ${{ runner.temp }}
        run: make native-qualify
      - name: Stop integration services
        if: ${{ always() && inputs.native_qualify }}
        run: docker compose down
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: native-release-${{ matrix.host }}
          path: ${{ runner.temp }}/native-archives/
          if-no-files-found: ignore
