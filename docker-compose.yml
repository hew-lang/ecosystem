services:
  postgres:
    image: postgres:16.10-alpine3.22
    environment:
      POSTGRES_USER: hew
      POSTGRES_PASSWORD: hew
      POSTGRES_DB: hew_test
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "--username=hew", "--dbname=hew_test"]
      interval: 5s
      timeout: 3s
      retries: 24

  redis:
    image: redis:7.4.10-alpine3.21
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 24

  mysql:
    image: mysql:8.4.6
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hew_test
      MYSQL_USER: hew
      MYSQL_PASSWORD: hew
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "--host=127.0.0.1", "--user=hew", "--password=hew", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 24

  nats:
    image: nats:2.11.8-alpine3.22
    command: ["-m", "8222"]
    ports:
      - "14222:4222"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 24

  mqtt:
    image: eclipse-mosquitto:2.0.22
    ports:
      - "11883:1883"
    # mosquitto 2.x denies anonymous clients by default; the image ships an
    # anonymous-listener config for this case.
    command: mosquitto -c /mosquitto-no-auth.conf
    healthcheck:
      test: ["CMD", "mosquitto_pub", "--host", "127.0.0.1", "--topic", "hew-health", "--message", "ready"]
      interval: 5s
      timeout: 5s
      retries: 24

  mongo:
    image: mongo:7.0.37
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 3s
      retries: 24

  # The healthcheck also creates the hew-test bucket the S3 suites use, so the
  # service reports healthy only once that bucket exists.
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test:
        - CMD-SHELL
        - mc alias set local http://127.0.0.1:9000 minioadmin minioadmin >/dev/null && mc mb --ignore-existing local/hew-test >/dev/null
      interval: 5s
      timeout: 3s
      retries: 24
