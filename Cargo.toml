[workspace]
members = [
  "db/mongodb",
  "db/mysql",
  "db/postgres",
  "db/redis",
  "db/sqlite",
  "db/sql",
  "image/magick",
  "metrics",
  "net/http",
  "queue/mqtt",
  "queue/nats",
  "storage/s3",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hew-lang/ecosystem"

[workspace.dependencies]
hew-cabi = { git = "https://github.com/hew-lang/hew", rev = "6a446f773391f45d2c0ce0a799240b8b9afef54e" }

[patch.crates-io]
# nuid 0.3.2 declares rand >=0.8, which resolves to an incompatible rand; this
# copy pins rand ^0.8.
nuid = { path = "vendor/nuid-fixed" }

[workspace.lints.rust]
ambiguous_negative_literals = "warn"
missing_debug_implementations = "warn"
redundant_imports = "warn"
redundant_lifetimes = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
complexity = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }
undocumented_unsafe_blocks = "warn"
allow_attributes_without_reason = "warn"

[profile.dev]
panic = "abort"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
