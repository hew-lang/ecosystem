[package]
name = "hew-ecosystem-queue-mqtt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "hew.queue.mqtt — MQTT 3.1.1 messaging client for Hew"
readme = "README.md"
keywords = ["hew", "mqtt", "messaging", "pubsub"]
categories = ["network-programming"]

[lib]
name = "hew_hew_queue_mqtt"
crate-type = ["staticlib", "lib"]

[dependencies]
hew-cabi.workspace = true
# default-features = false: TLS (tokio-rustls) deferred to v1 (see mqtt.hew
# out-of-scope note); v1 is plaintext TCP only, keeping the dep tree lean per
# the plan's dependency-weight note.
rumqttc = { version = "0.25", default-features = false }
libc.workspace = true

[features]
integration = []

[lints]
workspace = true
