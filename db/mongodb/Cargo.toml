[package]
name = "hew-ecosystem-db-mongodb"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "hew_hew_db_mongodb"
crate-type = ["staticlib", "lib"]

[dependencies]
mongodb = { version = "3", default-features = false, features = ["compat-3-0-0", "rustls-tls", "sync"] }
serde_json = "1"
hew-cabi.workspace = true
# mongodb's `sync` feature builds on tokio's multi-thread runtime without enabling it.
tokio = { version = "1", features = ["rt-multi-thread"] }

[lints]
workspace = true
