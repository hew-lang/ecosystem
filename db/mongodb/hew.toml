[package]
name = "hew.db.mongodb"
version = "0.3.0"
edition = "2026"
hew = ">=0.6.0-rc1, <0.7.0"
description = "Actor-owned MongoDB client with typed errors and JSON document queries"
authors = ["Hew Contributors"]
license = "MIT OR Apache-2.0"
keywords = ["database", "mongodb", "nosql", "document"]
repository = "https://github.com/hew-lang/ecosystem"

[native]
crate = "."
lib = "hew_hew_db_mongodb"
kind = "staticlib"
